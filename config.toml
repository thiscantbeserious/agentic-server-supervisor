# ZeroClaw Configuration: Server Sentinel
# Properly scoped for secure server monitoring

schema_version = 2

[providers]
# Providers and models will be populated by 'zeroclaw onboard'

[agent]
name = "bam"
max_tool_iterations = 20
compact_context = true

[autonomy]
level = "supervised"
workspace_only = false

# Fallback command whitelist (will be augmented during bootstrap)
allowed_commands = [
    "df", "free", "uptime", "cat", "head", "tail", "grep", "wc", "ls", 
    "find", "journalctl", "ss", "ip", "ping", "dig", "git", "ps"
]

allowed_roots = [
    "/etc/gemini-watcher/system/",
    "./"
]

forbidden_paths = [
    "/etc/shadow", "/etc/sudoers", "/root", "~/.ssh", "~/.gnupg", 
    "/var/lib/docker", "/proc/config.gz"
]

require_approval_for_medium_risk = true
block_high_risk_commands = true

[security.sandbox]
backend = "auto"

[memory]
backend = "sqlite"
path = "workspace/state/memory.db"
auto_save = true

[cron]
enabled = true
catch_up_on_startup = true
jobs = []

[heartbeat]
enabled = true
interval_minutes = 30

[observability]
backend = "log"

[channels.cli]
enabled = true

[channels.telegram]
enabled = true
# Replace with your own bot token from @BotFather
bot_token = "YOUR_TELEGRAM_BOT_TOKEN_HERE"
allowed_users = ["*"] # Adjust to your telegram username(s)
stream_mode = "off"


# ZeroClaw Configuration: Server Sentinel
# Properly scoped for secure server monitoring

schema_version = 2

[providers]
fallback = "gemini"

[providers.models.gemini]
model = "gemini-2.0-flash"
temperature = 0.5
timeout_secs = 60

[agent]
name = "Server Sentinel"
max_tool_iterations = 20
compact_context = true

[autonomy]
level = "supervised"
workspace_only = false  # Required to read system paths defined in allowed_roots

# Explicit command whitelist for health monitoring and investigation
allowed_commands = [
    "df", "free", "uptime", "cat", "head", "tail", "grep", "wc", "ls", 
    "find", "journalctl", "ss", "ip", "ping", "dig", "git", "ps"
]

# Scoping access to specific read-only system paths and the project workspace
allowed_roots = [
    "/etc/gemini-watcher/system/",
    "./"
]

# Hard blocks on sensitive system areas
forbidden_paths = [
    "/etc/shadow", "/etc/sudoers", "/root", "~/.ssh", "~/.gnupg", 
    "/var/lib/docker", "/proc/config.gz"
]

require_approval_for_medium_risk = true
block_high_risk_commands = true

[security.sandbox]
# Use auto to detect Firejail/Bubblewrap/Landlock
backend = "auto"

[memory]
backend = "sqlite"
path = "workspace/state/memory.db"
auto_save = true

[cron]
enabled = true
catch_up_on_startup = true
# Jobs will be defined via 'zeroclaw cron add' or in the jobs list here
jobs = []

[heartbeat]
enabled = true
interval_minutes = 30
# The heartbeat will trigger the sentinel to check in even if no cron is due

[observability]
backend = "log"

[channels.cli]
enabled = true

name: build

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "supervisor/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "supervisor/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sentinel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGY_URL=${{ vars.AGY_URL }}
            AGY_SHA256=${{ vars.AGY_SHA256 }}
            AGY_VERSION=${{ vars.AGY_VERSION }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and smoke-run the published image
        if: github.event_name != 'pull_request'
        run: |
          docker pull ghcr.io/${{ github.repository }}/sentinel:${{ github.sha }}
          docker run --rm ghcr.io/${{ github.repository }}/sentinel:${{ github.sha }} --version

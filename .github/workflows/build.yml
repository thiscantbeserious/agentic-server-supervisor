name: build

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# packages:write is scoped to the build job only (it pushes to GHCR); the
# test job only checks out and runs the Go toolchain and needs nothing
# beyond contents:read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  # The C1-C13 container suite (test/container_test.go, build tag
  # `container`) had never run in CI — only the unit suite above did.
  # C1's coherence assertion is independent of any build arg (it derives
  # its expectation from the test's own platform loop, not from
  # anything the build produced) and would have caught the TARGETARCH
  # ARG-scoping defect that shipped an amd64 image labelled arm64 — it
  # simply never ran anywhere but podman, which never had that defect.
  # This job is the fix for that: the same suite, on the same kind of
  # builder (real BuildKit-backed Docker, not podman) that produces what
  # ships.
  #
  # needs: test rather than running in parallel — this suite takes
  # several minutes and downloads real artifacts over the network; no
  # reason to spend that on a push where `go vet` or a unit test is
  # already broken.
  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same requirement as the build job: the suite builds and runs
      # images for both platforms, including the one non-native to this
      # runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: go test -tags container
        # AGY_URL_*/AGY_SHA512_* from repository variables, never
        # hardcoded here — same values the build job's build-args use.
        # Set, they make buildSentinelImage() build every test image
        # from the REAL vendor artifact instead of the synthetic
        # fixture, for every case in this run, not only the ones gated
        # on SENTINEL_REAL_AGY.
        #
        # SENTINEL_REAL_AGY=1 additionally runs TestContainer_RealAgyBuild,
        # which downloads and builds against the real tarballs directly
        # (its own fixture literals, not these vars — see that test's
        # own comment for why) rather than through buildSentinelImage.
        #
        # SENTINEL_E2E is deliberately NOT set here: TestE2E needs
        # apprise, mailrise, and the Telegram bot token as a secret —
        # a different decision from these public build args, left to
        # whoever owns that secret. It stays gated and uncovered by
        # this job.
        env:
          AGY_URL_AMD64: ${{ vars.AGY_URL_AMD64 }}
          AGY_SHA512_AMD64: ${{ vars.AGY_SHA512_AMD64 }}
          AGY_URL_ARM64: ${{ vars.AGY_URL_ARM64 }}
          AGY_SHA512_ARM64: ${{ vars.AGY_SHA512_ARM64 }}
          SENTINEL_REAL_AGY: "1"
        run: go test -tags container -v -timeout 25m ./test/...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # The arm64 pass executes arm64 code twice on this amd64 runner —
      # once for the in-build agy/sentinel verification steps, again for
      # the smoke-run step below — so the host needs binfmt_misc handlers
      # registered before buildx can run anything non-native.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sentinel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # Both architectures, always — contracts/runtime.md R1: arm64 is
          # not optional. buildx supplies TARGETARCH per platform; the
          # Dockerfile selects the matching AGY_URL_*/AGY_SHA512_* pair
          # for each.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGY_URL_AMD64=${{ vars.AGY_URL_AMD64 }}
            AGY_SHA512_AMD64=${{ vars.AGY_SHA512_AMD64 }}
            AGY_URL_ARM64=${{ vars.AGY_URL_ARM64 }}
            AGY_SHA512_ARM64=${{ vars.AGY_SHA512_ARM64 }}
            AGY_VERSION=${{ vars.AGY_VERSION }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and smoke-run the published image (both platforms)
        if: github.event_name != 'pull_request'
        # A multi-arch push produces a manifest list (contracts/runtime.md
        # R1/R6): `docker pull`/`docker run` with no --platform silently
        # resolves to the runner's OWN architecture
        # (amd64 on ubuntu-latest) and would leave arm64 completely
        # untested here — a manifest list makes that failure mode quiet,
        # since it is "correct" on every host by construction. Chosen
        # explicitly: pull and run BOTH platforms rather than declaring
        # this step single-arch-by-design, since the cost is two extra
        # lines and the alternative is an architecture that ships
        # untested by this step (the container suite covers it too, but
        # this is the step that proves the PUBLISHED image specifically
        # is pullable and runnable, not a locally built one).
        #
        # GHCR requires a lowercase image path. This repository is
        # already all-lowercase so raw ${{ github.repository }} works
        # today, but it is latent breakage for any repo/org with
        # capitals — lowercase it explicitly rather than relying on that
        # (the metadata-action step above does this automatically for
        # the tags it builds; this step reconstructs the reference by
        # hand, so it needs the same treatment).
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/sentinel:${{ github.sha }}"
          for PLATFORM in linux/amd64 linux/arm64; do
            echo "::group::$PLATFORM"
            docker pull --platform "$PLATFORM" "$IMAGE"

            # ELF e_machine read FIRST, for BOTH platforms and BOTH
            # binaries: it reads bytes rather than executing anything,
            # so it always works regardless of whether this runner can
            # emulate PLATFORM, and it proves the property that actually
            # matters — the right architecture binaries are in the right
            # image. A bare `--version` cannot prove that on its own; a
            # Dockerfile ARG-scoping defect once produced amd64 binaries
            # inside an image labelled and manifested as arm64, with
            # every execution-based check (including `sentinel
            # --version`, which a static binary passes under emulation
            # regardless of its real architecture) passing anyway.
            WANT="3e 00"; [ "$PLATFORM" = "linux/arm64" ] && WANT="b7 00"
            for BIN in sentinel agy; do
              GOT="$(docker run --rm --platform "$PLATFORM" --entrypoint od "$IMAGE" -An -tx1 -j18 -N2 /usr/local/bin/$BIN | tr -s ' ')"
              case "$GOT" in
                *"$WANT"*) ;;
                *) echo "$BIN ELF e_machine mismatch on $PLATFORM: got '$GOT', want '$WANT'" >&2; exit 1 ;;
              esac
            done

            # sentinel is a static Go binary and executes correctly
            # under this runner's emulation on both platforms.
            docker run --rm --platform "$PLATFORM" "$IMAGE" --version

            # agy is dynamically linked (interpreter /lib64/ld-linux-*.so.*)
            # and, with the ARG-scoping defect above fixed, is the
            # correct target-architecture binary — executing it here on
            # BOTH platforms, including under emulation, is a genuine
            # test again.
            #
            # Invoked through a shell rather than as a direct
            # --entrypoint exec: direct exec of agy on this runner's
            # native amd64 has failed once (exit 255) where the shell
            # form passed — cause not established, kept as the form
            # known to work.
            docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "$IMAGE" -c '/usr/local/bin/agy --version'
            echo "::endgroup::"
          done

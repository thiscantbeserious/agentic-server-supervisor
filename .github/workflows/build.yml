name: build

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# packages:write is scoped to the build job only (it pushes to GHCR); the
# test job only checks out and runs the Go toolchain and needs nothing
# beyond contents:read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # The arm64 pass executes arm64 code twice on this amd64 runner —
      # once for the in-build agy/sentinel verification steps, again for
      # the smoke-run step below — so the host needs binfmt_misc handlers
      # registered before buildx can run anything non-native.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sentinel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # Both architectures, always — contracts/runtime.md R1: arm64 is
          # not optional. buildx supplies TARGETARCH per platform; the
          # Dockerfile selects the matching AGY_URL_*/AGY_SHA512_* pair
          # for each.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGY_URL_AMD64=${{ vars.AGY_URL_AMD64 }}
            AGY_SHA512_AMD64=${{ vars.AGY_SHA512_AMD64 }}
            AGY_URL_ARM64=${{ vars.AGY_URL_ARM64 }}
            AGY_SHA512_ARM64=${{ vars.AGY_SHA512_ARM64 }}
            AGY_VERSION=${{ vars.AGY_VERSION }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and smoke-run the published image (both platforms)
        if: github.event_name != 'pull_request'
        # A multi-arch push produces a manifest list (contracts/runtime.md
        # R1/R6): `docker pull`/`docker run` with no --platform silently
        # resolves to the runner's OWN architecture
        # (amd64 on ubuntu-latest) and would leave arm64 completely
        # untested here — a manifest list makes that failure mode quiet,
        # since it is "correct" on every host by construction. Chosen
        # explicitly: pull and run BOTH platforms rather than declaring
        # this step single-arch-by-design, since the cost is two extra
        # lines and the alternative is an architecture that ships
        # untested by this step (the container suite covers it too, but
        # this is the step that proves the PUBLISHED image specifically
        # is pullable and runnable, not a locally built one).
        #
        # GHCR requires a lowercase image path. This repository is
        # already all-lowercase so raw ${{ github.repository }} works
        # today, but it is latent breakage for any repo/org with
        # capitals — lowercase it explicitly rather than relying on that
        # (the metadata-action step above does this automatically for
        # the tags it builds; this step reconstructs the reference by
        # hand, so it needs the same treatment).
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/sentinel:${{ github.sha }}"
          RUNNER_ARCH="$(dpkg --print-architecture)"
          for PLATFORM in linux/amd64 linux/arm64; do
            echo "::group::$PLATFORM"
            docker pull --platform "$PLATFORM" "$IMAGE"

            # ELF e_machine read FIRST, for BOTH platforms: it reads
            # bytes rather than executing anything, so it always works
            # regardless of whether this runner can emulate PLATFORM,
            # and it proves the property that actually matters — the
            # right architecture binary is in the right image. A bare
            # `--version` cannot prove that on its own; it is the exact
            # multi-arch mismatch this workflow's own build args exist
            # to prevent.
            WANT="3e 00"; [ "$PLATFORM" = "linux/arm64" ] && WANT="b7 00"
            GOT="$(docker run --rm --platform "$PLATFORM" --entrypoint od "$IMAGE" -An -tx1 -j18 -N2 /usr/local/bin/agy | tr -s ' ')"
            case "$GOT" in
              *"$WANT"*) ;;
              *) echo "agy ELF e_machine mismatch on $PLATFORM: got '$GOT', want '$WANT'" >&2; exit 1 ;;
            esac

            # sentinel is a static Go binary and executes correctly
            # under this runner's emulation on both platforms.
            docker run --rm --platform "$PLATFORM" "$IMAGE" --version

            # agy is dynamically linked (interpreter /lib64/ld-linux-*.so.*).
            # Measured on this runner, at both build time (Dockerfile RUN,
            # exit 127) and now at run time (this step: native amd64
            # passed, emulated arm64 failed with the same 127 signature)
            # — a dynamically-linked target-architecture binary cannot be
            # relied on to execute under this runner's QEMU emulation, at
            # either stage. So agy is only ever EXECUTED here on
            # whichever platform is native to this runner; architecture
            # on the other platform is already proven above by the ELF
            # read, and execution there is proven by the local container
            # suite, which builds and runs agy natively per host arch.
            #
            # Still invoked through a shell rather than as a direct
            # --entrypoint exec: direct exec of agy on this runner's
            # native amd64 has also failed once (exit 255) where the
            # shell form passed — cause not established, kept as the
            # form known to work.
            PLATFORM_ARCH="${PLATFORM#linux/}"
            if [ "$PLATFORM_ARCH" = "$RUNNER_ARCH" ]; then
              docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "$IMAGE" -c '/usr/local/bin/agy --version'
            else
              echo "SKIP: not executing agy for $PLATFORM on this $RUNNER_ARCH runner — a dynamically-linked binary is not reliably executable under emulation here (see comment above); architecture already verified by the ELF read"
            fi
            echo "::endgroup::"
          done

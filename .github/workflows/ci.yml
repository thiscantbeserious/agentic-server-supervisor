name: ci

# No `paths:` filter. A filter here stops the workflow from starting at
# all, and a required status check that never starts never reports, so a
# docs-only pull request sat BLOCKED forever against six checks that were
# not failing, merely absent. Filtering moved into the `changes` job below,
# whose skips DO report: GitHub counts a skipped job as a successful
# required check, but only for a workflow that actually ran.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# packages:write is scoped to the build/merge jobs only (they push to
# GHCR); test and container only check out and run the Go toolchain
# (plus, for container, a local docker build/run) and need nothing
# beyond contents:read.
permissions:
  contents: read

jobs:
  # changes decides whether the expensive jobs do anything. It is the one
  # thing standing between a code change and every gate in this file, so it
  # fails CLOSED: an event it does not recognise, a base commit it cannot
  # resolve, or a diff that errors all answer "code changed" and run the
  # full suite. The failure it must never have is the quiet one, deciding
  # nothing changed and reporting six green skips over unreviewed code.
  #
  # `scan` deliberately does NOT depend on this. Secret scanning has to see
  # every commit, and a leaked credential in a markdown file is still a
  # leaked credential; it costs about ten seconds, so there is nothing to
  # save by skipping it.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The diff needs both endpoints present locally; the default
          # shallow fetch has neither for a pull request.
          fetch-depth: 0

      - name: Decide whether anything the suite covers actually changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "changes: $1, running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)         base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *)            run_everything "event '$EVENT' is not one this job knows how to diff" ;;
          esac

          # A branch's first push reports an all-zero "before", and a force
          # push can name a commit that no longer exists.
          case "$base" in
            ""|0000000000000000000000000000000000000000) run_everything "no usable base commit" ;;
          esac
          git cat-file -e "${base}^{commit}" 2>/dev/null || run_everything "base commit $base is not in this clone"
          git cat-file -e "${head}^{commit}" 2>/dev/null || run_everything "head commit $head is not in this clone"

          if ! files="$(git diff --name-only "$base" "$head" 2>&1)"; then
            run_everything "git diff failed: $files"
          fi
          if [ -z "$files" ]; then
            run_everything "empty diff, which should not happen and is not worth trusting"
          fi

          echo "changes: files in $base..$head:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Anything outside this list is treated as covered by the suite,
          # so a path added to the repo later runs everything until someone
          # deliberately excludes it. Wrong in the safe direction.
          if printf '%s\n' "$files" | grep -qvE '^(README\.md|AGENTS\.md|CLAUDE\.md|ARCHITECTURE\.md|PLAN\.md|CONTRACTS\.md|LICENSE|\.gitignore|docs/|contracts/.*\.md$|.*\.md$)'; then
            run_everything "at least one changed path is not documentation"
          fi

          echo "changes: documentation only, skipping the jobs that build and test code"
          echo "code=false" >> "$GITHUB_OUTPUT"

  lint:
    # Everything gates on the secret scan: if a credential is in the tree,
    # nothing should build, test or publish from it. scan must stay
    # unconditional, a skipped dependency skips this job too, which would
    # turn a scan that never ran into a green pipeline that did nothing.
    needs: [scan, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  # Secret scanning that deliberately holds nothing. No secrets are exposed
  # to this job, it performs no registry login, and permissions is set to the
  # empty set rather than inheriting the workflow default.
  #
  # That is the point, not an oversight: third-party scanning is itself a
  # supply-chain entry point, and compromised scanner steps have been used to
  # exfiltrate CI credentials. A job holding no token and no secret is worth
  # nothing to whoever compromises it. Anything that would make this job more
  # helpful by giving it a credential, commenting on pull requests, pushing
  # fixes, trades away the only property that makes running it safe.
  #
  # The scanner is pinned by image digest for the same reason every action
  # above is pinned by commit SHA: a tag is a movable pointer, and moving one
  # is how a trusted step gets replaced without any consumer changing a line.
  #
  # --redact matters on a public repository: a scanner that prints the secret
  # it found into the build log has published it more widely than the commit did.
  scan:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0  # history, not just the tip, that is where secrets survive
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact --verbose

  test:
    # Everything gates on the secret scan: if a credential is in the tree,
    # nothing should build, test or publish from it. scan must stay
    # unconditional, a skipped dependency skips this job too, which would
    # turn a scan that never ran into a green pipeline that did nothing.
    needs: [scan, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  # internal/notify's TestE2E, gated on SENTINEL_E2E=1 and set here so
  # the real notify path runs on every push. No Telegram credential is
  # involved: apprise supports json://, which POSTs to an arbitrary HTTP
  # endpoint, so this job registers the apprise config key (and
  # mailrise.conf) against a mock this job's own `go test` process runs
  # instead of tgram://. That exercises sentinel -> apprise -> mock and
  # sentinel -> SMTP -> mailrise -> mock for real; the only unexercised
  # link is Telegram's own API, which is not ours to test and which a
  # real token would not meaningfully verify anyway (the mock's own
  # assertions on the real wire payload, title/message/type, delivery
  # counts, two fail-on-demand cases, are what actually verify OUR
  # side; see internal/notify/e2e_test.go's own comment for the full
  # list, including the finding that apprise's json:// output never
  # forwards a "format" field at all).
  #
  # Neither `services:` nor `docker compose` fit cleanly, so neither is
  # used. The mock lives IN the `go test` process, not in a container,
  # its assertions need direct access to the test's own state, so
  # apprise/mailrise need to reach a plain runner process, not another
  # container. `services:` containers on a job that does not itself run
  # in a container sit on a bridge network with no automatic route back
  # to a runner-level process. Reusing deploy/docker-compose.yml would
  # also need dummy values for JOURNAL_GID/AGY_CREDENTIALS_DIR just to
  # satisfy interpolation for a sentinel service this job never starts.
  # Two `docker run --network host` containers is the actual smallest
  # mechanism: host networking makes the mock's fixed port reachable
  # from both containers as plain localhost, with nothing to route.
  #
  # No Telegram credential anywhere in this job, and nothing here
  # reaches api.telegram.org.
  e2e:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod

      - name: Start apprise + mailrise (host networking, json:// mock target)
        run: |
          mkdir -p /tmp/e2e
          cat > /tmp/e2e/mailrise.conf <<'CONF'
          configs:
            sentinel:
              urls:
                - json://127.0.0.1:8079/notify
          smtp:
            auth:
              basic:
                e2euser: e2epass
          CONF

          docker run --rm -d --name e2e-apprise --network host \
            lscr.io/linuxserver/apprise-api:latest
          docker run --rm -d --name e2e-mailrise --network host \
            -v /tmp/e2e/mailrise.conf:/etc/mailrise.conf:ro \
            yoryan/mailrise:latest

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/status >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/status >/dev/null; then
            echo "apprise-api did not become healthy" >&2
            docker logs e2e-apprise >&2 || true
            exit 1
          fi

          curl -sS -X POST http://127.0.0.1:8000/add/sentinel \
            --data-urlencode "urls=json://127.0.0.1:8079/notify" -w "\n"

      - name: go test -run TestE2E
        env:
          SENTINEL_E2E: "1"
          SENTINEL_E2E_SINK_ADDR: "127.0.0.1:8079"
          SENTINEL_HOSTNAME: "ci-e2e"
          APPRISE_URL: "http://127.0.0.1:8000"
          APPRISE_KEY: "sentinel"
          MAILRISE_HOST: "127.0.0.1"
          MAILRISE_PORT: "8025"
          MAILRISE_USER: "e2euser"
          MAILRISE_PASS: "e2epass"
          SENTINEL_MAIL_FROM: "sentinel@mailrise.xyz"
          SENTINEL_MAIL_TO: "sentinel@mailrise.xyz"
          STATE_DIR: /tmp/e2e-state
        run: |
          mkdir -p "$STATE_DIR"
          go test -v -run TestE2E ./internal/notify/...

      - name: Container logs (always, for post-mortem)
        if: always()
        run: |
          docker logs e2e-apprise 2>&1 | tail -100 || true
          docker logs e2e-mailrise 2>&1 | tail -100 || true

  # The C1-C13 integration suite, run once per architecture on a runner
  # NATIVE to it, never both inside one job, never under emulation.
  #
  # Named for what it does rather than for how it does it: containers are
  # the mechanism, integration is the point. Every other job here is named
  # for its subject (lint, test, e2e, build), and "container" invited the
  # reading that this is a check ON the container image, which is the
  # build job's smoke step, not this.
  # Architecture is the matrix's job, not this suite's or the runner's:
  # test/container_test.go takes its own arch from runtime.GOARCH, which
  # is exactly the platform this job's runner actually is.
  #
  # C1's coherence assertion is independent of any build arg (it derives
  # its expectation from the process's own arch, not from anything the
  # build produced) and catches the class of defect where TARGETARCH
  # scoping ships an amd64 image labelled arm64, a defect this job's
  # own real BuildKit exposes and podman does not.
  #
  # needs: test rather than running in parallel, this suite takes
  # several minutes and downloads real artifacts over the network; no
  # reason to spend that on a push where `go vet` or a unit test is
  # already broken.
  integration:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: go test -tags container -race
        # AGY_URL_*/AGY_SHA512_* from repository variables, never
        # hardcoded here, same values the build job's build-args use.
        # Set, they make buildSentinelImage() build this job's test
        # image from the REAL vendor artifact instead of the synthetic
        # fixture, for every case in this run, not only the ones gated
        # on SENTINEL_REAL_AGY.
        #
        # SENTINEL_REAL_AGY=1 additionally runs TestContainer_RealAgyBuild,
        # which downloads and builds against the real tarball directly
        # (its own fixture literal for THIS matrix leg's arch, not these
        # vars, see that test's own comment for why) rather than
        # through buildSentinelImage.
        #
        # SENTINEL_E2E is deliberately NOT set here: TestE2E needs
        # apprise, mailrise, and the Telegram bot token as a secret,
        # a different decision from these public build args, left to
        # whoever owns that secret. It stays gated and uncovered by
        # this job.
        env:
          AGY_URL_AMD64: ${{ vars.AGY_URL_AMD64 }}
          AGY_SHA512_AMD64: ${{ vars.AGY_SHA512_AMD64 }}
          AGY_URL_ARM64: ${{ vars.AGY_URL_ARM64 }}
          AGY_SHA512_ARM64: ${{ vars.AGY_SHA512_ARM64 }}
          SENTINEL_REAL_AGY: "1"
        # -parallel 4: every TestContainer_* now calls t.Parallel (see
        # test/container_test.go's package comment). 4 matches this
        # runner's own vCPU count; most of the wall clock here is
        # containers waiting on I/O, not host CPU, but the 39 C12 cases
        # each start a full Debian container with an apt-get install
        # inside, so going well past the CPU count risks piling up
        # memory and daemon contention instead of buying real overlap.
        #
        # -race because this is the only suite where the Go test process
        # itself is concurrent: every TestContainer_* runs under
        # t.Parallel and they share helpers, temp dirs and the docker
        # client. A data race here corrupts one case's evidence with
        # another's, which reads as a flake rather than as a bug, and this
        # job has produced exactly one unexplained flake that both
        # architectures hit in the same run.
        run: go test -tags container -race -parallel 4 -v -timeout 40m ./test/...

  # install.sh runs as root on a real host and configures it, apt
  # dependency resolution, systemd, real packages. None of that exists
  # inside a container build, so no execution of this script anywhere has
  # ever reached its exit-0 success path, and container-only testing once
  # let msmtp-mta's apt conflict resolution remove postfix and, with it,
  # openmediavault and ten plugins, on a real host. These two jobs boot an
  # actual kernel under QEMU and run install.sh against it for real.
  #
  # Kept off the `container` matrix deliberately: that matrix is scoped to
  # architecture (native runner per arch, C1's whole reason for existing),
  # these jobs are scoped to host platform (plain Debian vs. OpenMediaVault)
  # and always run amd64, folding them in would make one matrix answer two
  # unrelated questions.
  #
  # KVM acceleration is used when the runner offers it and TCG (software
  # emulation) otherwise; test/vm/lib.sh's vm_detect_accel logs which was
  # used and why, so an unexpectedly slow run is explained by its own log,
  # not left a mystery. Neither job may skip: a job that quietly does
  # nothing when /dev/kvm is unavailable is the exact failure shape this
  # project has already been bitten by once (T7's original single-runner
  # QEMU design, contracts/runtime.md R6), and would be worse here, this
  # job's entire purpose is the thing that has never actually run.
  vm-e2e-debian:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install QEMU + cloud-init tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client

      # The Debian cloud image download is the only thing this variant
      # could usefully cache, and actions/cache is branch-scoped: a
      # feature branch cannot read a cache written on another branch (only
      # the default branch's own cache is visible everywhere). That
      # scoping is exactly why the OMV base image below is NOT cached this
      # way and goes to GHCR instead, but this download is cheap (a single
      # pinned-URL fetch, no provisioning), so paying it again per branch
      # on a cache miss is not worth a second GHCR publishing path. Kept
      # deliberately simple: this variant's whole point is staying cheap.
      - name: Cache the Debian cloud base image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /tmp/vm-debian-cache/debian-base.qcow2
          key: debian-cloud-image-${{ hashFiles('test/vm/fetch-debian-cloud-image.sh') }}

      - name: Run the plain-Debian install.sh E2E
        run: |
          mkdir -p /tmp/vm-debian-cache
          if [ -f /tmp/vm-debian-cache/debian-base.qcow2 ]; then
            echo "debian cloud image: cache hit"
          else
            echo "debian cloud image: cache miss, will download"
          fi
          bash test/vm/run-debian-e2e.sh /tmp/vm-work-debian

  # The valuable half of this pair: a real OMV host is the only place the
  # removal cascade, the platform config markers, and the compose-root
  # absolute-symlink layout can be checked against reality instead of a
  # fixture someone wrote from memory. Split into two jobs so the
  # expensive, GHCR-publishing half never runs anywhere a PR's own token
  # could reach it.
  #
  # Image tag is a content hash of everything that determines what ends up
  # on the provisioned disk (the provisioning script + the pinned Debian
  # base image fetch script), never a moving tag like `latest`, for the
  # same reason every action in this workflow is pinned by commit SHA
  # rather than by a tag that can move underneath a consumer. A stale
  # image answering to the same name as a fresh one is worse than no cache
  # at all, this is what makes that impossible: a changed script is a
  # different tag, full stop.
  vm-omv-image:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client

      - id: tag
        run: echo "tag=$(cat test/vm/build-omv-image.sh test/vm/provision-omv.sh test/vm/fetch-debian-cloud-image.sh test/vm/cloud-init-user-data.tmpl | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned literal, not derived from github.repository: a repo rename
      # must never silently move where this gets published, it takes a
      # reviewed diff to this line instead. Same reasoning as the
      # sentinel image name below.
      - name: Pin the image name
        id: image
        run: echo "name=ghcr.io/thiscantbeserious/ops-nanny/omv-base" >> "$GITHUB_OUTPUT"

      - name: Check whether this content hash is already published
        id: probe
        run: |
          if docker pull "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "vm-omv-image: cache HIT, ${{ steps.tag.outputs.tag }} already published, nothing to build"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "vm-omv-image: cache MISS, ${{ steps.tag.outputs.tag }} not found, building from scratch"
          fi

      - name: Build the OMV base image (cache miss only)
        if: steps.probe.outputs.hit != 'true'
        run: bash test/vm/build-omv-image.sh /tmp/omv-base.qcow2 /tmp/vm-work-omv-build

      - name: Package and publish the base image (cache miss only)
        if: steps.probe.outputs.hit != 'true'
        run: |
          mkdir -p /tmp/omv-image-ctx
          cp /tmp/omv-base.qcow2 /tmp/omv-image-ctx/base.qcow2
          printf 'FROM scratch\nCOPY base.qcow2 /base.qcow2\n' > /tmp/omv-image-ctx/Dockerfile
          docker build -t "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}" /tmp/omv-image-ctx
          docker push "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}"

  # Runs on pull requests as well. The reasoning that kept both OMV jobs
  # off pull requests assumed a PR could never have a warm image to pull,
  # which stopped being true once vm-omv-image was allowed to run there
  # too: it publishes under a content hash, so the pair costs a manifest
  # probe and a boot whenever that hash is already built.
  #
  # It is NOT uniformly cheap, and the expensive case is the likely one.
  # The hash covers build-omv-image.sh, provision-omv.sh, the cloud image
  # fetcher and the cloud-init template, so any PR touching those has no
  # published image and rebuilds from scratch, roughly half an hour, on
  # its first push. That is paid once per distinct content, not per push,
  # and it warms the cache for every later run including main's. A PR that
  # leaves those four files alone pays neither.
  #
  # The alternative, letting the job run and skip when nothing is
  # published, stays rejected: a job that quietly does nothing on missing
  # input is the failure shape this whole pair exists to rule out.
  vm-e2e-omv:
    # Depends on the image job rather than only on `test`: both used to hang
    # off `test` and run side by side, so a cold cache built the same OMV
    # image twice, concurrently, for about fifteen minutes each. Chaining
    # them means the image is published once and pulled here. On a warm
    # cache the dependency costs the seconds vm-omv-image needs to confirm
    # the content hash is already published.
    needs: [test, vm-omv-image, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client sshpass

      - id: tag
        run: echo "tag=$(cat test/vm/build-omv-image.sh test/vm/provision-omv.sh test/vm/fetch-debian-cloud-image.sh test/vm/cloud-init-user-data.tmpl | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Read-only login: this job never holds packages:write, so even a
      # compromised step in it cannot publish anything under this
      # project's name. Publishing is vm-omv-image's job alone, and that
      # job never runs on a pull_request.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned literal, not derived from github.repository, see the
      # matching comment in vm-omv-image.
      - name: Pin the image name
        id: image
        run: echo "name=ghcr.io/thiscantbeserious/ops-nanny/omv-base" >> "$GITHUB_OUTPUT"

      - name: Pull the cached OMV base image, build locally on a cold cache
        run: |
          if docker pull "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}"; then
            echo "vm-e2e-omv: cache HIT, ${{ steps.tag.outputs.tag }}"
            # The trailing "true" is never executed. The image is FROM scratch
            # and carries no CMD, and docker create refuses to make a
            # container with no command at all, so it needs a placeholder to
            # record. Only the cache-hit path reaches this, which is why it
            # stayed hidden until an image was published for the first time.
            docker create --name omv-base-extract "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}" true
            docker cp omv-base-extract:/base.qcow2 /tmp/omv-base.qcow2
            docker rm omv-base-extract
          else
            echo "vm-e2e-omv: cache MISS, ${{ steps.tag.outputs.tag }} not published yet (first push on this content). Building locally for THIS run only; this job holds no publish permission, so the shared cache is warmed by vm-omv-image running alongside it on this same push, not by this job."
            sudo apt-get install -y --no-install-recommends qemu-system-x86
            bash test/vm/build-omv-image.sh /tmp/omv-base.qcow2 /tmp/vm-work-omv-build
          fi

      - name: Run the OpenMediaVault install.sh E2E
        run: bash test/vm/run-omv-e2e.sh /tmp/omv-base.qcow2 /tmp/vm-work-omv-run

  # Built per architecture, on a runner native to it, and pushed by
  # digest rather than by tag, no tag exists yet for a single-arch
  # push, only after `merge` below assembles all of them into one
  # manifest list and tags THAT. This is what makes the design
  # genuinely architecture-independent: a third architecture later is
  # one more matrix row here (and in `container` above) and nothing
  # else, no workflow logic branches on which architectures exist.
  build:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned literal, not derived from github.repository: this repo has
      # been renamed twice already, and deriving the publish target from
      # the repo's current name means a rename silently moves it, with
      # nothing in the diff to review, and every consumer still pointed
      # at the old path stops receiving pushes without any error anywhere.
      # A pin makes that move a reviewed line in this file instead.
      # Computed once here so every later step (the build's own tag, the
      # smoke pull, the digest artifact) references the same value.
      - name: Pin the image name
        id: image
        run: echo "name=ghcr.io/thiscantbeserious/ops-nanny/sentinel" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/Dockerfile
          # Single platform, this job's own, matching the runner it is
          # already executing on. buildx supplies TARGETARCH/TARGETPLATFORM
          # for it; the Dockerfile selects the matching
          # AGY_URL_*/AGY_SHA512_* pair.
          platforms: ${{ matrix.platform }}
          # No tag: pushed by digest only. `merge` assembles the
          # manifest list from every architecture's digest and applies
          # the real tags to THAT, so a tag never points at a
          # single-architecture image even transiently.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            AGY_URL_AMD64=${{ vars.AGY_URL_AMD64 }}
            AGY_SHA512_AMD64=${{ vars.AGY_SHA512_AMD64 }}
            AGY_URL_ARM64=${{ vars.AGY_URL_ARM64 }}
            AGY_SHA512_ARM64=${{ vars.AGY_SHA512_ARM64 }}
            AGY_VERSION=${{ vars.AGY_VERSION }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Smoke-test this architecture's pushed digest, natively
        if: github.event_name != 'pull_request'
        # No --platform anywhere below: this runner IS matrix.arch, so
        # every docker run here executes natively. Nothing to emulate,
        # nothing to branch on.
        run: |
          IMAGE="${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE"

          # ELF e_machine read FIRST, for BOTH binaries: it reads bytes
          # rather than executing anything, and proves the property
          # that actually matters, the right architecture binaries are
          # in the right image. A bare `--version` cannot prove that on
          # its own; a Dockerfile ARG-scoping defect once produced
          # amd64 binaries inside an image labelled and manifested as
          # arm64, with every execution-based check (including
          # `sentinel --version`, which a static binary happily runs
          # regardless of its real architecture) passing anyway.
          WANT="3e 00"; [ "${{ matrix.arch }}" = "arm64" ] && WANT="b7 00"
          for BIN in sentinel agy; do
            GOT="$(docker run --rm --entrypoint od "$IMAGE" -An -tx1 -j18 -N2 /usr/local/bin/$BIN | tr -s ' ')"
            case "$GOT" in
              *"$WANT"*) ;;
              *) echo "$BIN ELF e_machine mismatch: got '$GOT', want '$WANT'" >&2; exit 1 ;;
            esac
          done

          docker run --rm "$IMAGE" --version

          # Invoked through a shell rather than as a direct --entrypoint
          # exec: direct exec of agy on a GitHub runner has failed once
          # (exit 255) where the shell form passed, cause not
          # established, kept as the form known to work.
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '/usr/local/bin/agy --version'

          # A FRESH named volume over /state, as the unprivileged user the
          # compose file runs this image as, read-only root filesystem and
          # all. Docker initialises a new volume from the image's directory
          # and takes its ownership with it, so this passes only while
          # /state exists in the image owned by 10001.
          #
          # Without it the volume is created root-owned, every tick fails
          # with "state dir not writable", and nothing in a read_only
          # container can repair it. That shipped, and was found by reading
          # the logs of a real deployment that had not completed a single
          # tick in twenty minutes. Every check above passed the whole time:
          # they run the image WITHOUT the volume that production gives it.
          VOL="smoke-state-${{ matrix.arch }}-$$"
          docker volume create "$VOL" >/dev/null
          if ! docker run --rm --read-only --user 10001:10001 -v "$VOL":/state \
                 --entrypoint /bin/sh "$IMAGE" -c 'touch /state/.writable && rm /state/.writable'; then
            echo "/state is not writable by the user this image runs as; a fresh volume would land root-owned" >&2
            docker volume rm "$VOL" >/dev/null 2>&1 || true
            exit 1
          fi
          docker volume rm "$VOL" >/dev/null

      - name: Export this architecture's digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles every architecture's digest (needs: build waits for the
  # WHOLE matrix, and fails if any leg failed, fail-fast: false on
  # `build` means one architecture failing is still visible on its own,
  # but a manifest list is never published missing the architecture
  # that failed) into one manifest list and tags it. A third
  # architecture later needs no change here: it is picked up by
  # downloading its digest artifact along with the others.
  #
  # Skipped on pull_request BY DESIGN, not by omission, a PR build
  # never pushes (github.event_name != 'pull_request' on `build`'s own
  # outputs), so there is no digest anywhere for `imagetools create` to
  # assemble. `imagetools create` is fundamentally a REGISTRY operation
  #, it fetches manifests by digest and pushes a combined one, it has
  # no local-images-only mode. Making it exercisable on a PR without
  # writing to GHCR would need a registry every matrix leg of `build`
  # AND this job can all reach, and GitHub Actions jobs are separate
  # runner VMs with no shared state between them: a registry container
  # started inside one matrix leg is not visible to the others or to
  # this job. The only way around that is an external registry service
  # or a scoped, still-real push to GHCR, both real infrastructure,
  # not a small addition, and both weigh more than what this catches.
  # So: this step's own correctness is proven on every push to `main`,
  # never on a PR, a green PR does not cover it, and a broken
  # `imagetools create` invocation is only visible after a push, not
  # before. Named here so nobody reads a green PR as having verified
  # manifest assembly.
  # build-ok exists to give the ruleset one context name that reports in
  # both directions. A matrix job reports per-combination names while it
  # runs ("build (linux/amd64, amd64, ubuntu-24.04)"), but a SKIPPED matrix
  # job reports once, under the bare job name, and never expands. Requiring
  # the expanded names therefore left a documentation-only pull request
  # waiting forever on two contexts that could not exist for it, while every
  # non-matrix job in this file reported "skipped" and satisfied its own
  # requirement normally.
  #
  # `if: always()` is what makes this run at all when build is skipped; the
  # result is then inspected explicitly rather than inherited, so a real
  # build failure still fails here and only a deliberate skip passes.
  build-ok:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require build to have succeeded or been deliberately skipped
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build result: $RESULT"
          case "$RESULT" in
            success|skipped) ;;
            *) echo "build did not succeed, refusing to report this as a passing gate" >&2; exit 1 ;;
          esac

  merge:
    # build alone is not enough: build only proves each architecture's
    # image builds and starts, not that C1-C13 pass or that the live
    # notify path works. container and e2e are build's siblings (both
    # `needs: test` only), so without listing them here a broken
    # install.sh or a broken notify path could fail red while the
    # digests still publish and this job still tags them, the tag is
    # the thing an operator pulls, so it is the one place that must not
    # move on unverified digests. lint (actionlint) is included for the
    # same reason C13 requires it: a workflow-shape defect must gate
    # the publish, not just report on it afterward.
    # Every job here must stay unconditional: a skipped dependency skips this
    # job too, which would leave a green run with no manifest list published.
    needs: [build, integration, e2e, lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Download every architecture's digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned literal, see the matching comment in build.
      - name: Pin the image name
        id: image
        run: echo "name=ghcr.io/thiscantbeserious/ops-nanny/sentinel" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Create the manifest list and push it, tagged
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # each tag/digest must land as its own
          # -t flag / positional argument; quoting would collapse the list
          # into one malformed argument. This disable is file-scoped (a
          # directive at the top of a `run:` block applies to the whole
          # block, not just the next line) and is correct only because
          # this block is a single command, keep it that way, or a
          # later command added below would silently inherit the same
          # suppression.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Verify the manifest list advertises every architecture
        run: |
          REF="${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker buildx imagetools inspect "$REF"
          PLATFORMS="$(docker buildx imagetools inspect "$REF" --raw | jq -r '.manifests[].platform | select(.os=="linux") | .os+"/"+.architecture' | sort -u)"
          for want in linux/amd64 linux/arm64; do
            echo "$PLATFORMS" | grep -qx "$want" || { echo "manifest list missing $want" >&2; exit 1; }
          done
